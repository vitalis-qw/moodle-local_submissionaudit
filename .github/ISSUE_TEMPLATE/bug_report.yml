name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set "Minimum word count" to 50
        2. Submit an assignment with ...
        3. Open Submission audit
    validations:
      required: true
  - type: input
    id: moodle
    attributes:
      label: Moodle version
      placeholder: "4.5.3 (Build: 20250310)"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: db
    attributes:
      label: Database
      options: [PostgreSQL, MariaDB, MySQL, Other]
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3"
  - type: textarea
    id: logs
    attributes:
      label: Errors or debug output
      description: With debugging set to DEVELOPER. Remove personal data.
      render: text
